<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2042"/>
      <stop offset="50%" stop-color="#1A3A6E"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect width="100" height="100" rx="22" fill="url(#glow)"/>
  <!-- Padlock body -->
  <rect x="22" y="47" width="56" height="40" rx="9" fill="white" opacity="0.93"/>
  <!-- Padlock shackle -->
  <path d="M33 47V33C33 18 67 18 67 33V47" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.93"/>
  <!-- Keyhole outer circle -->
  <circle cx="50" cy="64" r="8" fill="#0F2042" opacity="0.55"/>
  <!-- Keyhole slot -->
  <rect x="47" y="64" width="6" height="10" rx="2" fill="#0F2042" opacity="0.55"/>
  <!-- Blue accent highlight -->
  <circle cx="50" cy="18" r="3" fill="#60A5FA" opacity="0.7"/>
</svg>
